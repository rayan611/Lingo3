<!doctype html><html><head><meta charset="utf-8"><title>Lingo3 responsive QA</title><style>html,body{margin:0;background:#e7eaf0}iframe{border:0;background:white;display:block}p{font:13px sans-serif;margin:4px}</style></head><body><p id="label"></p><iframe title="Lingo3 viewport under test"></iframe><script>const q=new URLSearchParams(location.search);const width=[360,390,768,820,1366].includes(Number(q.get('width')))?Number(q.get('width')):390;const locale=['en','fa','sv','de'].includes(q.get('locale'))?q.get('locale'):'en';localStorage.setItem('lingo3.ui.preference.guest',JSON.stringify({locale,theme:q.get('theme')==='dark'?'dark':'light'}));const frame=document.querySelector('iframe');frame.style.width=width+'px';frame.style.height='1000px';frame.src=q.get('path')?.startsWith('/academy')?q.get('path'):'/';document.querySelector('#label').textContent='Viewport '+width+'px / '+locale;</script></body></html>
