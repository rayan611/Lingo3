<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7A52A8" />
    <title>Lingo3 — learn up to 3 languages</title>
    <meta name="application-name" content="Lingo3" />
    <meta name="apple-mobile-web-app-title" content="Lingo3" />

    <!-- These are here, in the static head, rather than set by React, because
         the things that read them do not run JavaScript: a WhatsApp or Telegram
         link preview, a crawler, curl. Without them, the only text such a
         visitor finds in this file is the boot fallback below — so sending the
         link to someone previewed the words "Lingo3 didn't start". -->
    <meta
      name="description"
      content="Learn up to three languages at once from your own words. Each language is scheduled separately, and it works offline."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lingo3" />
    <meta property="og:title" content="Lingo3 — learn up to 3 languages" />
    <meta
      property="og:description"
      content="Learn up to three languages at once from your own words. Each language is scheduled separately, and it works offline."
    />
    <!-- Absolute, not "/icon-512.png": several link-preview scrapers do not
         resolve a relative og:image against the page URL, and the ones that
         fail do it silently. Same reason og:url is spelled out. -->
    <meta property="og:url" content="https://lingo3.com/" />
    <meta property="og:image" content="https://lingo3.com/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Shown only if the app never mounts. React replaces #root's contents on
         boot, so if you are reading this in a browser, the bundle failed to
         load or threw before first render — which is exactly the case a blank
         page tells you nothing about. */
      #boot-fallback {
        display: none;
        font-family: ui-sans-serif, system-ui, sans-serif;
        max-width: 32rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
        line-height: 1.55;
        color: #1f2933;
      }
      #boot-fallback.visible { display: block; }
      #boot-fallback code {
        background: #f0eee9;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        font-size: 0.9em;
      }
      #boot-fallback button {
        font: inherit;
        padding: 0.6rem 1rem;
        border-radius: 8px;
        border: 1px solid #2f6f5e;
        background: #2f6f5e;
        color: #fff;
        cursor: pointer;
        margin-top: 0.5rem;
      }
      #boot-error {
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        background: #f0eee9;
        padding: 0.75rem;
        border-radius: 8px;
        overflow-x: auto;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #15181b; }
        #boot-fallback { color: #e8e6e1; }
        #boot-fallback code, #boot-error { background: #1d2125; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-fallback">
      <h2>Lingo3 didn't start</h2>
      <p>
        The page loaded but the app failed to run. The most common cause is an
        old service worker still serving a stale or broken copy — tap below to
        clear it and reload.
      </p>
      <button id="boot-reset" type="button">Clear cache and reload</button>
      <p>
        If that doesn't help, the error is below. Send it to Claude and it can
        be fixed.
      </p>
      <pre id="boot-error">(no error captured)</pre>
    </div>

    <script src="/boot.js"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
